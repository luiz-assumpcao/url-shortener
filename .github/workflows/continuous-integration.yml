name: Continuous Integration
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: url_shortener_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Check out repository code
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Apply database schema
              run: psql -h localhost -U postgres -d url_shortener_test -f db/schema.sql
              env:
                  PGPASSWORD: postgres

            - name: Run tests
              run: npm test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/url_shortener_test
                  JWT_SECRET: ci_test_secret
